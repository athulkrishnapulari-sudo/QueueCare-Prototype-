<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueueCare | Family Details</title>
    <style>
      :root {
        color-scheme: light;

        --primary: #0f766e;
        --primary-dark: #0d6b64;
        --primary-light: #14b8a6;
        --secondary: #16a34a;
        --accent: #2563eb;

        --background: #f8fafc;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: var(--background);
        color: var(--text);
        padding: 40px 20px;
      }

      main {
        max-width: 850px;
        margin: auto;
      }

      h1 {
        color: var(--primary);
        margin-bottom: 30px;
        font-size: 2rem;
      }

      form {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      }

      form span {
        display: inline-block;
        margin-bottom: 25px;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--primary);
      }

      #row {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
      }

      .field,
      #dob,
      #blood,
      #gender {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .field {
        margin-bottom: 20px;
      }

      label {
        margin-bottom: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--muted);
      }

      input,
      select {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        font-size: 15px;
        color: var(--text);
        transition: 0.25s;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.15);
      }

      input::placeholder {
        color: #9ca3af;
      }

      button {
        margin-top: 15px;
        width: 60%;
        height: 50px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.25s;
      }
      .secondaryBtn{
        width:50%;
        height:40px;
        background:var(--border);
        color:black;
      }
      .secondaryBtn:hover{
        background: var(--card);
      }

      button:hover {
        background: var(--primary-dark);
      }

      button:active {
        transform: scale(0.98);
      }
      .buttonGroup{
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #form_container{
        display: flex;
        flex-direction: column;
        gap:20px;
      }
      #row{
        justify-content: space-between;
      }
      .deleteBtn{
        all:unset;
        display: flex;
        align-items: center;
        justify-content: center;
        color: red;
        background: none !important;
      }
      

      @media (max-width: 768px) {
        body {
          padding: 20px;
        }

        form {
          padding: 20px;
        }

        #row {
          flex-direction: column;
          gap: 16px;
          margin-bottom: 16px;
        }

        .field {
          margin-bottom: 16px;
        }
      }
      
    </style>
    <script defer src="family.js"></script>
  </head>
  <body>
    <main>
      <h1>Family Details</h1>
      <div id="form_container">
      <form action="" id="person1">
        <button style="display: none;" type="button" class="deleteBtn"></button>
        <span>Person 1 - Self</span>
        <div id="row">
          <input type="text" id="Relationship1"  style="display: none;">
          <div id="firstName" class="field">
            <label for="">First Name</label>
            <input type="text" id="FirstNameInput1" required/>
          </div>
          <div id="lastName" class="field">
            <label for="">Last Name</label>
            <input type="text" id="LastNameInput1" required />
          </div>
        </div>
        <div id="phoneNumber" class="field">
          <label for="">Phone Number</label>
          <input type="tel" id="PhoneNumberInput1" required />
        </div>
        <div id="email" class="field">
          <label for="">Email Address</label>
          <input type="email" id="EmailAddress1" required/>
        </div>
        <div id="row">
          <div id="dob">
            <label for="">Date of Birth</label>
            <input type="date" id="DOB1" required/>
          </div>
          <div id="blood">
            <label for="">Blood Group</label>
            <select id="BloodGroup1" name="BloodGroup1" required>
              <option value="" selected disabled>Select Blood Group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
          <div id="gender">
            <label for="">Gender</label>
            <select name="" id="GenderInput1" required>
              <option value="" selected disabled>Select Your Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </form>
      </div>
      <div class="buttonGroup">
        <button type="button" class="secondaryBtn">+ Add New Member</button>

        <button type="button" class="primaryBtn" id="submitBtn">Save & Continue</button>
      </div>
    </main>
  </body>
</html>
